name: v2-cicd.yml

on:
  push:
    branches:
      - v2/develop
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - v2/develop
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend/forgather

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Write test info to GitHub
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: build/libs/*.jar
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: build/libs/

      - name: Deploy to Development Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploying to development server..."
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

          # 기존 8080 포트 프로세스 종료
          ssh -i ~/.ssh/deploy_key.pem -p 2222 -o StrictHostKeyChecking=no \
            $DEPLOY_USER@$DEPLOY_HOST "fuser -k 8080/tcp || echo 'No process on 8080'"

          # JAR 파일을 서버 홈 디렉토리로 복사
          scp -i ~/.ssh/deploy_key.pem -P 2222 -o StrictHostKeyChecking=no \
            build/libs/*.jar $DEPLOY_USER@$DEPLOY_HOST:~/

          # 새로운 애플리케이션 실행
          ssh -i ~/.ssh/deploy_key.pem -p 2222 -o StrictHostKeyChecking=no \
            $DEPLOY_USER@$DEPLOY_HOST "nohup java -jar ~/*.jar > /dev/null 2>&1 &"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment completed with status: ${{ job.status }}"
