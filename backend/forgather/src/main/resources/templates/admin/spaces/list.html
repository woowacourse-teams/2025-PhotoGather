<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaces Management - Forgather Admin</title>

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <!-- Spaces CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/spaces.css}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <h1 class="logo">
                    <a th:href="@{/view/admin/spaces}">Forgather Admin</a>
                </h1>
            </div>
            <nav class="header-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a th:href="@{/view/admin/spaces}" class="nav-link active">Spaces</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/view/admin/hosts}" class="nav-link">Hosts</a>
                    </li>
                    <li class="nav-item">
                        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <h2>스페이스 관리 페이지</h2>
                <p>전체 스페이스 조회 및 관리 페이지</p>
            </div>

            <!-- Controls -->
            <div class="controls">
                <!--
                    필터 영역
                    - 작품 소개 등록 여부에 따른 필터링 기능
                    - radio 버튼으로 단일 선택 제공
                    - 향후 다른 필터 조건 추가 시 filter-group을 복사하여 확장
                -->
                <div class="filter-section">
                    <!--
                        작품 소개 등록 여부 필터 그룹
                        - name 속성을 동일하게 하여 radio 그룹화
                        - value: 'all' (전체), 'true' (등록함), 'false' (미등록)
                        - 기본값은 'all' (checked 속성)
                    -->
                    <div class="filter-group">
                        <label class="filter-label">작품 소개 등록 여부:</label>
                        <label class="filter-radio-label">
                            <input type="radio" name="hasProduct" value="all" checked>
                            <span>전체</span>
                        </label>
                        <label class="filter-radio-label">
                            <input type="radio" name="hasProduct" value="true">
                            <span>등록함</span>
                        </label>
                        <label class="filter-radio-label">
                            <input type="radio" name="hasProduct" value="false">
                            <span>등록하지 않음</span>
                        </label>
                    </div>

                    <!--
                        검색 버튼
                        - 필터 선택 후 이 버튼을 클릭해야 필터가 적용됨
                        - JavaScript의 applyFilter() 함수 호출
                    -->
                    <button type="button" class="btn-filter" id="applyFilterBtn">검색</button>
                </div>

                <div class="page-size-selector">
                    <label for="pageSize">Items per page:</label>
                    <select id="pageSize" class="form-select">
                        <option value="15" selected>15</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <!-- Spaces Table -->
            <div class="table-container">
                <table class="data-table" id="spacesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>스페이스 코드</th>
                            <th>스페이스 이름</th>
                            <th>스페이스 공개 여부</th>
                            <th>생성 시간</th>
                            <th>수정 시간</th>
                        </tr>
                    </thead>
                    <tbody id="spacesTableBody">
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination: JavaScript에서 숫자 버튼들을 동적으로 생성 -->
            <div class="pagination" id="pagination" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 Forgather. All rights reserved.</p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!--
        스페이스 상세 정보 모달
        - 기본적으로 숨김 상태 (display: none)
        - JavaScript에서 spaceCode 클릭 시 표시
        - ESC 키 또는 오버레이 클릭 시 닫힘
        - 모달이 열렸을 때 body의 스크롤 방지
    -->
    <div id="spaceDetailModal" class="modal-overlay" style="display: none;" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-container">
            <!-- 모달 헤더 -->
            <div class="modal-header">
                <h3 id="modalTitle" class="modal-title">Space Details</h3>
                <button id="closeModalBtn" class="modal-close-btn" aria-label="Close modal">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- 모달 내용 -->
            <div class="modal-body">
                <!-- 로딩 상태 표시 -->
                <div id="modalLoading" class="modal-loading" style="display: none;">
                    <div class="spinner-small"></div>
                    <p>Loading space details...</p>
                </div>

                <!-- 에러 상태 표시 -->
                <div id="modalError" class="modal-error" style="display: none;"></div>

                <!-- 스페이스 상세 정보 (데이터가 로드되면 JavaScript로 채워짐) -->
                <div id="modalContent" class="modal-content" style="display: none;">
                    <div class="modal-info-group">
                        <label class="modal-info-label">스페이스 ID</label>
                        <div id="modalSpaceId" class="modal-info-value"></div>
                    </div>

                    <div class="modal-info-group">
                        <label class="modal-info-label">스페이스 코드</label>
                        <div id="modalSpaceCode" class="modal-info-value modal-code"></div>
                    </div>

                    <div class="modal-info-group">
                        <label class="modal-info-label">스페이스 이름</label>
                        <div id="modalSpaceName" class="modal-info-value"></div>
                    </div>

                    <div class="modal-info-group">
                        <label class="modal-info-label">스페이스 공개 여부</label>
                        <div id="modalSpacePublic" class="modal-info-value"></div>
                    </div>

                    <div class="modal-info-group">
                        <label class="modal-info-label">등록한 작품 소개</label>
                        <div id="modalHasProduct" class="modal-info-value"></div>
                    </div>

                    <div class="modal-info-group">
                        <label class="modal-info-label">방명록 개수</label>
                        <div id="modalGuestBookCount" class="modal-info-value"></div>
                    </div>
                </div>
            </div>

            <!-- 모달 푸터 (게스트 페이지 이동 버튼) -->
            <div class="modal-footer">
                <button id="visitSpaceBtn" class="btn btn-primary" style="display: none;" aria-label="게스트 페이지로 이동">
                    게스트 페이지로 이동
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/pagination.js}"></script>
    <script th:src="@{/js/admin/spaces.js}"></script>
</body>
</html>
