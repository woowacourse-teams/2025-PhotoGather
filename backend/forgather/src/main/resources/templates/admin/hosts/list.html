<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosts Management - Forgather Admin</title>

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <!-- Hosts CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/hosts.css}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <h1 class="logo">
                    <a th:href="@{/view/admin/spaces}">Forgather Admin</a>
                </h1>
            </div>
            <nav class="header-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a th:href="@{/view/admin/spaces}" class="nav-link">Spaces</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/view/admin/hosts}" class="nav-link active">Hosts</a>
                    </li>
                    <li class="nav-item">
                        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!--
                Page Header
                - 페이지 제목과 설명을 표시합니다.
                - 사용자에게 현재 페이지가 무엇인지 명확히 알립니다.
            -->
            <div class="page-header">
                <h2>호스트 관리 페이지</h2>
                <p>전체 호스트 조회 및 관리 페이지</p>
            </div>

            <!--
                Controls: 페이지 크기 선택
                - 사용자가 한 페이지에 표시될 아이템 개수를 선택할 수 있습니다.
                - JavaScript에서 변경 이벤트를 감지하여 데이터를 다시 로드합니다.
            -->
            <div class="controls">
                <div class="page-size-selector">
                    <label for="pageSize">Items per page:</label>
                    <select id="pageSize" class="form-select">
                        <option value="15" selected>15</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>

            <!--
                Loading Spinner
                - API 호출 중에 표시됩니다.
                - 사용자에게 데이터 로딩 중임을 시각적으로 알립니다.
                - 기본적으로 숨김 상태(display: none)이며, JavaScript에서 제어합니다.
            -->
            <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>

            <!--
                Error Message
                - API 호출 실패 시 에러 메시지를 표시합니다.
                - 사용자 친화적인 에러 메시지를 제공합니다.
                - 기본적으로 숨김 상태이며, JavaScript에서 제어합니다.
            -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <!--
                Hosts Table
                - 호스트 목록을 테이블 형태로 표시합니다.
                - thead: 테이블 헤더 (ID, 호스트명, 스페이스 개수, 생성일)
                - tbody: 테이블 데이터 (JavaScript로 동적 생성)
            -->
            <div class="table-container">
                <table class="data-table" id="hostsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>호스트명</th>
                            <th>스페이스 개수</th>
                            <th>생성일</th>
                        </tr>
                    </thead>
                    <tbody id="hostsTableBody">
                        <!--
                            데이터는 JavaScript로 동적 렌더링됩니다.
                            hosts.js의 renderHostsTable() 함수 참조
                        -->
                    </tbody>
                </table>
            </div>

            <!--
                Pagination
                - 숫자 페이지 네비게이션을 제공합니다.
                - JavaScript의 PaginationUtil을 사용하여 동적으로 렌더링됩니다.
                - 기본적으로 숨김 상태이며, 데이터 로드 후 표시됩니다.
            -->
            <div class="pagination" id="pagination" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 Forgather. All rights reserved.</p>
        </div>
    </footer>

    <!--
        Toast Notification
        - 사용자에게 짧은 알림 메시지를 표시합니다.
        - JavaScript에서 showToast() 함수로 제어합니다.
        - 3초 후 자동으로 사라집니다.
    -->
    <div id="toast" class="toast"></div>

    <!--
        Scripts
        - auth.js: 인증 관련 유틸리티 (토큰 관리, 로그인 체크)
        - api.js: API 호출 유틸리티 (fetch 래퍼, 401 자동 처리)
        - pagination.js: 페이지네이션 렌더링 유틸리티
        - hosts.js: 호스트 목록 페이지 로직 (데이터 로딩, 테이블 렌더링, 페이지네이션)

        순서가 중요합니다:
        1. auth.js가 먼저 로드되어 Auth 전역 객체 생성
        2. api.js가 Auth를 사용하여 API 전역 객체 생성
        3. pagination.js가 PaginationUtil 전역 객체 생성
        4. hosts.js가 API와 PaginationUtil을 사용하여 데이터 로드 및 렌더링
    -->
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/pagination.js}"></script>
    <script th:src="@{/js/admin/hosts.js}"></script>
</body>
</html>
